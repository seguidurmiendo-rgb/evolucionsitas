<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolución S.I.T.A.S. – Ideas</title>
  <meta name="description" content="Formulario de ideas y propuestas para Evolución S.I.T.A.S." />

  <style>
    :root{
      --bg0:#070A10;
      --bg1:#0B1220;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.10);
      --text:#E7EAF0;
      --muted:#AAB3C5;
      --accent:#D6B25E;
      --accent2:#7DD3FC;
      --border: rgba(255,255,255,.12);
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(125,211,252,.10), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(214,178,94,.14), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .wrap{
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    header{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size: clamp(22px, 4vw, 34px);
    }

    .subtitle{
      margin-top:8px;
      color: var(--muted);
      font-size:14.5px;
      max-width:60ch;
    }

    .card{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .card-inner{
      padding:16px;
    }

    .iframe-wrap{
      border-top:1px solid var(--border);
      padding:14px;
    }

    iframe{
      width:100%;
      height:900px;
      border:0;
      border-radius:14px;
      background:#000;
    }

    footer{
      margin-top:16px;
      text-align:center;
      color: var(--muted);
      font-size:12.5px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Evolución S.I.T.A.S.</h1>
        <p class="subtitle">
          Espacio para que los socios aporten ideas y propuestas para mejorar el club:
          seguridad, instalaciones, cursos y competencias.
        </p>
      </div>
    </header>

    <section class="card">
      <div class="card-inner">
        <strong>Cargar nueva idea</strong>
      </div>
      <div class="iframe-wrap">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSf-GIhDFif_n7NPIdaIX1KHSVGMcEBuLCEiIanCG0hxAMhI3Q/viewform?embedded=true"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <footer>
      Sitio publicado con GitHub Pages · Respuestas guardadas en Google Forms
    </footer>
  </div>
</body>
</html>
